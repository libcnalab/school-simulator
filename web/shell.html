<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Simulator</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #10131a; color: #f3f4f6; }
    body { display: grid; place-items: center; font: 16px system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; border: 0; background: #10131a; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #10131a; pointer-events: none; }
    #loading[hidden] { display: none; }
    #loading-content { width: min(28rem, calc(100vw - 3rem)); text-align: center; }
    #loading h1 { margin: 0 0 0.4rem; font-size: 1.6rem; font-weight: 500; }
    #loading p.sub { margin: 0 0 1.5rem; opacity: 0.7; }
    #status { min-height: 1.5rem; margin: 0 0 0.75rem; }
    progress { display: block; width: 100%; height: 0.75rem; accent-color: #e8c66a; }
    #hint { position: fixed; left: 0; right: 0; bottom: 0.6rem; text-align: center; font-size: 0.8rem; opacity: 0.55; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="loading" role="status" aria-live="polite">
    <div id="loading-content">
      <h1>School Simulator</h1>
      <p class="sub">A living school on CNA, in your browser</p>
      <p id="status">Downloading the school&hellip;</p>
      <progress id="progress" max="1" value="0"></progress>
    </div>
  </div>
  <div id="hint">Click the picture to look around with the mouse &middot; WASD walk &middot; Shift run &middot; E use &middot; F1 help &middot; Esc releases the mouse</div>
  <script>
    const canvas = document.getElementById('canvas');
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const hint = document.getElementById('hint');

    canvas.addEventListener('webglcontextlost', function (event) {
      event.preventDefault();
      loading.hidden = false;
      status.textContent = 'Graphics context lost. Reload the page to continue.';
      progress.hidden = true;
    });

    function setStatus(message) {
      if (!message) { loading.hidden = true; return; }
      loading.hidden = false;
      const counts = message.match(/\((\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)\)/);
      if (counts) {
        progress.max = Number(counts[2]);
        progress.value = Number(counts[1]);
        progress.hidden = false;
        status.textContent = message.slice(0, counts.index).trim();
      } else {
        status.textContent = message;
        if (message === 'All downloads complete.') { progress.max = 1; progress.value = 1; progress.hidden = false; }
      }
    }

    var Module = {
      canvas: canvas,
      // ?arg=--preset=light&arg=--time=08:00 passes the desktop command line (see docs/SCRIPTING.md).
      arguments: new URLSearchParams(window.location.search).getAll('arg'),
      setStatus: setStatus,
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        setStatus(left ? 'Preparing the school (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      },
      print: function (text) { console.log(text); },
      printErr: function (text) { console.warn(text); }
    };
    window.addEventListener('error', function (event) {
      if (event.target !== window) return;
      loading.hidden = false;
      status.textContent = 'Unable to start. Check the browser console and reload.';
      progress.hidden = true;
    });
    // Once the game is drawing, the loading cover goes away by itself (setStatus('') from Emscripten); the hint fades.
    setTimeout(function () { hint.style.transition = 'opacity 2s'; hint.style.opacity = 0; }, 20000);
  </script>
  {{{ SCRIPT }}}
</body>
</html>
