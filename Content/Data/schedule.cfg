# The school day. One phase per line: start time, kind, lesson number (or -), name.
# Kinds: night arrival passing lesson longbreak lunch dismissal clubs closing.
# A "passing" phase carries the number of the lesson that follows it. Lines starting with "drill"
# schedule a fire drill at that time on a weekday (mon tue wed thu fri) or every day.
# Replace or edit this file to run a different day; the app falls back to the built-in copy if it is invalid.
00:00 night - Closed
07:30 arrival - Doors open
07:50 passing 1 Go to lessons
08:00 lesson 1 Lesson 1
08:45 passing 2 Change of rooms
08:55 lesson 2 Lesson 2
09:40 longbreak - Long break
09:55 passing 3 Change of rooms
10:00 lesson 3 Lesson 3
10:45 passing 4 Change of rooms
10:55 lesson 4 Lesson 4
11:40 passing 5 Change of rooms
11:50 lesson 5 Lesson 5
12:35 lunch - Lunch
13:30 passing 6 Change of rooms
13:40 lesson 6 Lesson 6
14:25 passing 7 Change of rooms
14:30 lesson 7 Lesson 7
15:15 dismissal - End of school
15:40 clubs - After-school clubs
17:30 closing - Closing
19:00 night - Closed
drill 10:20 wed
